[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cookidoo-mcp"
version = "1.1.0"
description = "AI-powered Cookidoo and Thermomix recipe, shopping-list, and meal-planning automation"
readme = "PYPI.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Alexandre Patelli" },
  { name = "Vitalie Miron" },
]
keywords = [
  "ai-agents",
  "cookidoo",
  "fastmcp",
  "mcp",
  "meal-planning",
  "model-context-protocol",
  "recipes",
  "thermomix",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]
dependencies = [
  "cookidoo-api>=0.17.2,<0.18",
  "fastmcp>=3.4.5,<4",
  "Pillow>=10.0.0,<13",
  "pydantic>=2.0.0,<3",
  "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "black>=23.0.0",
  "build>=1.2.2",
  "pytest>=8.0.0",
  "ruff>=0.1.0",
  "twine>=6.0.0",
]

[project.scripts]
cookidoo-mcp = "cookidoo_mcp.cli:main"

[project.urls]
Homepage = "https://vitaliemiron.github.io/cookidoo-mcp/"
Documentation = "https://vitaliemiron.github.io/cookidoo-mcp/docs/"
Repository = "https://github.com/vitaliemiron/cookidoo-mcp"
Issues = "https://github.com/vitaliemiron/cookidoo-mcp/issues"
Changelog = "https://github.com/vitaliemiron/cookidoo-mcp/releases"

[tool.setuptools]
include-package-data = false
packages = ["cookidoo_mcp"]
py-modules = ["cookidoo_service", "schemas", "server"]
