name: Bug report
description: Report a reproducible problem in Cookidoo MCP
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Cookidoo MCP. Remove credentials, cookies,
        account IDs, private recipe content, and upload signatures before posting.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I removed all credentials and private Cookidoo data.
          required: true
        - label: I restarted the MCP server after changing code or configuration.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the user-visible result.
      placeholder: When I call ..., I expect ..., but ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest repeatable sequence, using placeholders for private values.
      placeholder: |
        1. Connect using ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: Client name and version
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Python 3.12, source install
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or traceback
      description: Redact credentials, cookies, signatures, account IDs, and private recipe data.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, related links, or other details if useful.
