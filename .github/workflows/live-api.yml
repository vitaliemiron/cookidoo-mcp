name: Cookidoo live API

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cookidoo_service.py"
      - "server.py"
      - "schemas.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "tests/live/**"
      - ".github/workflows/live-api.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: cookidoo-live-api
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COOKIDOO_EMAIL: ${{ secrets.COOKIDOO_EMAIL }}
      COOKIDOO_PASSWORD: ${{ secrets.COOKIDOO_PASSWORD }}
      COOKIDOO_LIVE_TESTS: "1"
      COOKIDOO_LIVE_MUTATIONS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Test authenticated Cookidoo API
        run: python -m pytest tests/live -m live --strict-markers -v

      - name: Open or update a regression issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Cookidoo live API regression"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message="The authenticated Cookidoo API smoke tests failed. [Open the failed workflow run](${run_url}) to see which contract changed."
          issue_number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${title} in:title" --json number,title --jq '.[] | select(.title == "Cookidoo live API regression") | .number' | head -n 1)"
          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body "${message}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${message}"
          fi

      - name: Close a recovered regression issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Cookidoo live API regression"
          issue_number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${title} in:title" --json number,title --jq '.[] | select(.title == "Cookidoo live API regression") | .number' | head -n 1)"
          if [ -n "${issue_number}" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "${issue_number}" --repo "${GITHUB_REPOSITORY}" --comment "The live API smoke tests are green again. [Open the successful workflow run](${run_url})."
          fi
