name: Publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example, v1.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Match package metadata to the tag
        run: python scripts/check_release_metadata.py "${RELEASE_TAG#v}"

      - name: Run offline tests
        run: |
          python -m pip install ".[dev]"
          python -m pytest -m "not live" --strict-markers -q

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Generate a CycloneDX SBOM
        run: |
          sbom_environment="${RUNNER_TEMP}/sbom-environment"
          python -m venv "$sbom_environment"
          "$sbom_environment/bin/python" -m pip install \
            --disable-pip-version-check dist/*.whl
          python -m pip install "cyclonedx-bom==7.3.1"
          mkdir -p sbom
          cyclonedx-py environment "$sbom_environment/bin/python" \
            --pyproject pyproject.toml \
            --mc-type application \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file "sbom/cookidoo-mcp-${RELEASE_TAG}.cdx.json"
          python - \
            "sbom/cookidoo-mcp-${RELEASE_TAG}.cdx.json" \
            "https://github.com/${GITHUB_REPOSITORY}@${RELEASE_TAG}" <<'PY'
          import json
          from pathlib import Path
          import sys
          import uuid

          path = Path(sys.argv[1])
          document = json.loads(path.read_text(encoding="utf-8"))
          if document.get("bomFormat") != "CycloneDX":
              raise ValueError("SBOM must declare bomFormat as CycloneDX")
          if not document.get("specVersion"):
              raise ValueError("CycloneDX SBOM must declare specVersion")
          document["serialNumber"] = (
              f"urn:uuid:{uuid.uuid5(uuid.NAMESPACE_URL, sys.argv[2])}"
          )
          path.write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Attest distribution build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*

      - name: Attest the distribution SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*
          sbom-path: sbom/cookidoo-mcp-${{ env.RELEASE_TAG }}.cdx.json

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cookidoo-mcp/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish package with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-registry:
    name: Publish to the MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Wait for the package to become visible on PyPI
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/cookidoo-mcp/${version}/json" \
              > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "cookidoo-mcp ${version} is not visible on PyPI" >&2
          exit 1

      - name: Install the verified MCP publisher
        env:
          PUBLISHER_VERSION: "1.8.0"
          PUBLISHER_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
        run: |
          archive="${RUNNER_TEMP}/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${PUBLISHER_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" \
            mcp-publisher

      - name: Validate registry metadata
        run: |
          "$RUNNER_TEMP/mcp-publisher" validate server.json

      - name: Authenticate to the MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc

      - name: Publish registry metadata
        run: |
          "$RUNNER_TEMP/mcp-publisher" publish server.json

      - name: Verify the published registry version
        run: |
          python scripts/verify_registry_publication.py \
            "${RELEASE_TAG#v}" \
            --attempts 12 \
            --delay 10

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Download the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: sbom/

      - name: Create or refresh the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* sbom/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* sbom/* \
              --generate-notes \
              --title "Cookidoo MCP ${RELEASE_TAG#v}" \
              --verify-tag
          fi
