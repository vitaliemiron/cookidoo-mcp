name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Lint
        run: >-
          ruff check
          cookidoo_mcp
          cookidoo_service.py
          schemas.py
          scripts
          server.py
          tests

      - name: Run unit tests
        run: python -m pytest -m "not live" --strict-markers -q

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify release metadata
        run: python scripts/check_release_metadata.py

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test the installed command
        run: |
          expected_version="$(python -c 'from cookidoo_mcp import __version__; print(__version__)')"
          test "$(cookidoo-mcp --version)" = "cookidoo-mcp ${expected_version}"
          python -c "from server import mcp; assert mcp.name == 'cookidoo-mcp-server'"

  windows-package:
    name: Windows package setup
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and install the wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName

      - name: Smoke-test the installed command and env-file path
        shell: pwsh
        run: |
          $version = cookidoo-mcp --version
          $expectedVersion = python -c "from cookidoo_mcp import __version__; print(__version__)"
          if ($version -ne "cookidoo-mcp $expectedVersion") {
            throw "Unexpected version output: $version"
          }
          $envFile = Join-Path $env:RUNNER_TEMP "cookidoo.env"
          @"
          COOKIDOO_EMAIL=windows-placeholder@example.com
          COOKIDOO_PASSWORD=windows-placeholder
          COOKIDOO_COUNTRY=ro
          COOKIDOO_LANGUAGE=en
          "@ | Set-Content -Encoding utf8 $envFile
          python -c "from pathlib import Path; from dotenv import dotenv_values; data = dotenv_values(Path(r'$envFile')); assert data['COOKIDOO_COUNTRY'] == 'ro'"
          python -c "from server import mcp; assert mcp.name == 'cookidoo-mcp-server'"
