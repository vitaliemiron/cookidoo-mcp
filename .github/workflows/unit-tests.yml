name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Lint
        run: >-
          ruff check
          cookidoo_mcp
          cookidoo_service.py
          schemas.py
          scripts
          server.py
          tests

      - name: Run unit tests
        run: python -m pytest -m "not live" --strict-markers -q

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify release metadata
        run: python scripts/check_release_metadata.py

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test the installed command
        run: |
          test "$(cookidoo-mcp --version)" = "cookidoo-mcp 1.0.0"
          python -c "from server import mcp; assert mcp.name == 'cookidoo-mcp-server'"
